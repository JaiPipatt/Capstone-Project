algo_node:
  ros__parameters:
    num_modules: 3
    pose_topic: ground_truth/odom   # change to the AprilTag topic later
    rate: 10.0                      # Hz
    max_linear: 0.049               # m/s (50 RPM motor / 5.333 wheel gear * 0.05 m)
    max_angular: 1.0                # rad/s
    goal_tolerance: 0.01            # m, pre-dock and dock positions
    waypoint_tolerance: 0.02        # m, intermediate grid nodes
    heading_tolerance: 0.05         # rad
    module_width: 0.107             # m, centre-to-centre when docked
    pose_timeout: 0.0               # s, stop a module whose pose is older; 0 = off
    world_frame: world              # frame of the poses (RViz)
    grid: 0.107                     # m, keep equal to module_width so slots sit on grid nodes
    stuck_timeout: 5.0              # s with no progress before replanning; 0 = off
    stuck_distance: 0.01            # m of travel that counts as progress
    stuck_turn: 0.1                 # rad of turning that counts as progress
    max_replans: 3                  # per module, then it is marked failed
    offtrack_distance: 0.03         # m sideways off the route (wheel slip) -> replan; 0 = off
    max_offtrack_replans: 10        # per module, then it is marked failed
    # Target shape: 'u,cu,v,cv' = slot u face cu docks to slot v face cv.
    # L-shape, corner at slot 0:  [2]
    #                              |
    #                             [0]-[1]
    connections: ['1,B,0,T', '2,B,0,L']
